name: Daily Feed and Observatory Refresh

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price feeds
        run: |
          python -m dora.feeds || echo "Feeds encountered an issue; retained previous price curve files."

      - name: Run regional observatory
        run: |
          python -m dora.observatory

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dora/data/price_curves/*_latest.json dora/data/basis_*.json observatory/*.json
          if ! git diff --cached --quiet; then
            DATE_STR=$(date -u +'%Y-%m-%d')
            git commit -m "Daily refresh $DATE_STR"
            git push
          else
            echo "No data changes detected. Nothing to commit."
          fi
